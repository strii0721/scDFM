[project]
name = "scdfm-vcc"
version = "0.1.0"
description = "scDFM (Distributional Flow Matching) adapted for VCC 2026 perturbation prediction"
requires-python = ">=3.11,<3.12"
dependencies = [
    # core training stack
    "torch==2.7.1",
    "torchdiffeq==0.2.5",
    "accelerate==1.9.0",
    "tyro==0.9.27",
    "timm==1.0.19",
    # single-cell
    "scanpy==1.11.4",
    "anndata==0.12.1",
    "cell-eval==0.5.42",
    # numerics / data
    "numpy==2.2.6",
    "scipy==1.16.1",
    "pandas==2.3.1",
    "scikit-learn",
    "POT==0.9.5",
    "networkx==3.5",
    "requests",
    "beautifulsoup4",
    "tqdm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
